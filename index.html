<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>어디쌤 · 비슬고 선생님 위치 안내</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#0A1A33; --muted:#5A6A85; --line:#D5DBE6;
  --brand:#1F4BFF; --brand-ink:#FFFFFF; --pin:#FF3B5C; --soft:#E6ECFB;
  --f1:#F26B21; --f2:#F2B01E; --f3:#12A56B; --f4:#1B7FE0; --f5:#8B5CF6; --f-ink:#FFFFFF; --f2-ink:#3A2A00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#131E33; --ink:#EAF0FF; --muted:#93A3C2; --line:#26344F;
    --brand:#6C8CFF; --brand-ink:#08122B; --soft:#1B2A4A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#131E33; --ink:#EAF0FF; --muted:#93A3C2; --line:#26344F;
  --brand:#6C8CFF; --brand-ink:#08122B; --soft:#1B2A4A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;padding:14px 14px 40px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{font-family:"Jua","Noto Sans KR",sans-serif;font-size:2rem;font-weight:400;letter-spacing:.04em;line-height:1.35;margin:0;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pin);position:relative}
.logo i::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
.chip{background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.sim{background:var(--pin);color:#fff}

.search{position:relative;margin-bottom:14px}
.search input{width:100%;height:56px;border-radius:28px;border:2px solid var(--ink);background:var(--surface);padding:0 22px;font-size:1.05rem}
.search input::placeholder{color:var(--muted)}

.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .app[data-mode="detail"] .listcol{display:none}
  .app[data-mode="search"] .detailcol{display:none}
}
.listcol{background:var(--surface);border-radius:20px;padding:8px;border:1px solid var(--line)}
@media (min-width:821px){.listcol{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:12px}}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:10px}
.row:hover{background:var(--soft)}
.row[aria-pressed="true"]{background:var(--soft);box-shadow:inset 0 0 0 2px var(--brand)}
.badge{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:var(--f-ink);background:var(--muted)}
.badge.f1{background:var(--f1)} .badge.f2{background:var(--f2);color:var(--f2-ink)} .badge.f3{background:var(--f3)} .badge.f4{background:var(--f4)} .badge.f5{background:var(--f5)}
.badge.big{width:84px;height:84px;font-size:2.4rem;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
.rt{min-width:0}
.rt b{font-size:1rem}
.rt small{color:var(--muted);margin-left:6px}
.rt span{display:block;font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:20px;color:var(--muted);text-align:center}

.detailcol{display:grid;gap:14px}
.back{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:500}
@media (min-width:821px){.back{display:none}}
.answer{background:var(--surface);border-radius:22px;padding:18px;border:1px solid var(--line);display:flex;gap:16px;align-items:center}
.answer h2{margin:0;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:1.9rem;line-height:1.15}
.answer p{margin:4px 0 0;color:var(--muted)}
.who{font-size:.95rem;color:var(--muted);margin:0 0 2px}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:1px 8px;font-size:.78rem;margin-top:8px;color:var(--muted)}

.panel{background:var(--surface);border-radius:22px;padding:14px;border:1px solid var(--line)}
.floors{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fbtn{border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-weight:700;position:relative}
.fbtn[aria-selected="true"]{color:#fff;border-color:transparent}
.fbtn.f1[aria-selected="true"]{background:var(--f1)} .fbtn.f2[aria-selected="true"]{background:var(--f2);color:var(--f2-ink)}
.fbtn.f3[aria-selected="true"]{background:var(--f3)} .fbtn.f4[aria-selected="true"]{background:var(--f4)} .fbtn.f5[aria-selected="true"]{background:var(--f5)}
.fbtn.here::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--pin);border:2px solid var(--surface)}
.zoom{margin-left:auto;display:flex;gap:6px}
.zoom button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.mapwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:#fff;-webkit-overflow-scrolling:touch}
.mapinner{position:relative}
.mapinner img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hl{position:absolute;border:3px solid var(--pin);background:rgba(255,59,92,.26);border-radius:6px;pointer-events:none}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--pin);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.pin::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--pin);opacity:.0}
@media (prefers-reduced-motion: no-preference){.pin::after{animation:ring 1.8s ease-out infinite}}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.placing .mapinner{cursor:crosshair}
.hint{margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.nomap{padding:26px 14px;text-align:center;color:var(--muted);background:var(--soft);border-radius:14px}

.days{display:flex;gap:6px;margin-bottom:10px}
.days button{flex:1;border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 0;font-weight:700}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;padding:0 0 0 0}
.stop{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px 6px 0;border-radius:12px}
.node{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;align-self:stretch}
.node b{width:26px;height:26px;border-radius:50%;background:var(--muted);color:#fff;display:grid;place-items:center;font-size:.8rem;z-index:1}
.node b.f1{background:var(--f1)} .node b.f2{background:var(--f2);color:var(--f2-ink)} .node b.f3{background:var(--f3)} .node b.f4{background:var(--f4)} .node b.f5{background:var(--f5)}
.node::after{content:"";flex:1;width:4px;background:var(--line);margin-top:2px}
.route li:last-child .node::after{display:none}
.stop .t{min-width:0;padding-bottom:6px}
.stop .t b{display:block}
.stop .t span{color:var(--muted);font-size:.9rem}
.stop.now{background:var(--soft);box-shadow:inset 0 0 0 2px var(--pin)}
.stop:hover{background:var(--soft)}

.tools{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.tools summary{cursor:pointer;color:var(--muted);font-weight:500}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.trow select,.trow input,.trow textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.trow textarea{width:100%;min-height:90px;font-family:monospace;font-size:.8rem}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:transparent;color:var(--pin);border:2px solid var(--pin)}
.small{font-size:.82rem;color:var(--muted);margin:8px 0 0}
body:not(.admin) .adminOnly{display:none!important}
.deskform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.deskform input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#homeLogo:focus-visible{outline:3px solid var(--brand);outline-offset:5px}

/* 교실 이름을 가리지 않도록 점 대신 투명한 테두리만 사용 */
.hl{background:transparent;border:3px solid var(--pin);box-shadow:0 0 0 1px white}
.pin{background:transparent;border:2px solid var(--pin);box-shadow:none}
.pin::after{border-width:2px}
#simDay{min-width:90px;min-height:44px;color:var(--ink);background:var(--surface)}
#simTime{min-width:150px;min-height:44px;cursor:pointer}

/* 원형 위치 표시는 제거하고 교실 외곽선만 강조합니다. */
.pin{display:none!important}
.hl{background:transparent;border:3px solid var(--pin);box-shadow:0 0 0 1px white;pointer-events:none}
@media (prefers-reduced-motion: no-preference){.hl{animation:roomBorderPulse 1.8s ease-in-out infinite}}
@keyframes roomBorderPulse{0%,100%{border-color:var(--pin);box-shadow:0 0 0 1px white}50%{border-color:var(--pin);box-shadow:0 0 0 1px white,0 0 8px 2px var(--pin)}}

/* 선택된 방: 옅은 채움 + 선명한 외곽선. 내부 글자는 그대로 보존 */
.hl{background:rgba(255,59,92,.10);border:4px solid var(--pin);box-shadow:0 0 0 2px rgba(255,255,255,.95);animation:none}
@media (prefers-reduced-motion: no-preference){.hl{animation:clearRoomPulse 1.8s ease-in-out infinite}}
@keyframes clearRoomPulse{0%,100%{background:rgba(255,59,92,.08);box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 3px rgba(255,59,92,.25)}50%{background:rgba(255,59,92,.15);box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 7px rgba(255,59,92,.22),0 0 12px rgba(255,59,92,.4)}}

/* 교사 목록: 이름 / 과목·담임 / 위치를 일정한 세 줄로 정렬 */
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.row .rt b{display:block;font-size:1rem;line-height:1.45}
.row .rt small{display:block;margin:0;font-size:.76rem;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row .rt>span{font-size:.82rem;line-height:1.45}
@media(max-width:380px){.row{gap:9px;padding:9px}.row .rt small{font-size:.72rem}}
</style>
</head>
<body>
<div class="app" data-mode="search" id="app">
<header class="top">
<h1 class="logo"><button id="homeLogo" type="button" aria-label="어디쌤 처음 화면으로 돌아가기" style="all:unset;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:8px"><i aria-hidden="true"></i>어디쌤</button></h1>
<div aria-live="polite" class="chip" id="chip">--:--</div>
</header>
<p class="small" style="padding:12px;border:1px solid #bbb;border-radius:12px">시간표 기반 예상 위치입니다. 실시간 재실 확인이 아니며 휴일·시험·보강·출장은 반영되지 않습니다. 시간은 한국 표준시 기준입니다. 지도에는 개인 책상 위치가 아닌, 선생님의 기본 교무실·학년실 위치가 표시됩니다.</p><div class="search">
<input aria-label="선생님 검색" autocomplete="off" id="q" placeholder="선생님 이름, 과목, 담임 반(예: 2-3)으로 찾기" type="search"/>
</div>
<div class="layout">
<aside aria-label="선생님 목록" class="listcol"><div id="list"></div></aside>
<main class="detailcol" id="detail"></main>
</div>
<details class="tools">
<summary>요일·시간별 위치 조회</summary><p class="small">원하는 요일과 시간을 선택하면, 그 시간의 시간표상 장소를 확인할 수 있어요.</p>
<div class="trow">
<select aria-label="요일" id="simDay"><option value="" selected disabled>요일</option><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option></select>
<input aria-label="시각" id="simTime" type="time" value="10:45"/>
<button class="btn" id="simApply">선택한 시간으로 조회</button>
<button class="btn ghost" id="simLive">현재 시간으로 돌아가기</button>
</div>



<p class="small">조회 전용입니다. 자리와 시간표는 이 파일에 포함된 데이터를 기준으로 안내합니다. 교시 시간은 학교 확인이 필요합니다.</p>
</details>
</div>

const CLUBS={"조정래": {"club": "리트머스", "place": "2-9"}, "김혜원": {"club": "이에스디바이옴", "place": "2-8 / 지구과학실 / 생물실"}, "이하늘": {"club": "지피티1", "place": "컴퓨터1실"}, "변강순": {"club": "지피티2", "place": "컴퓨터1실"}, "장소영": {"club": "엔젤인널스2", "place": "스팀실 / 비슬고"}, "류승원": {"club": "넥서스", "place": "1-10 / 과학실"}, "김정희": {"club": "폴리스1", "place": "1-7"}, "김유진": {"club": "폴리스2", "place": "1-7"}, "장성훈": {"club": "카탈리스트", "place": "2-10 / 실험실 / 교내"}, "지문성": {"club": "메지컬", "place": "2-12 / 화학실"}, "이경락": {"club": "서시", "place": "2-7"}, "김지희": {"club": "글로벌", "place": "2-12 (3/25 첫 활동만 명시 · 나머지 장소 공란)"}, "한종수": {"club": "에프비아이1", "place": "R&E실"}, "금영일": {"club": "에프비아이2", "place": "R&E실"}, "이양지": {"club": "이코닉스", "place": "2-2"}, "김성국": {"club": "심봉사1", "place": "대입지도실 / 교내 / 지역 복지관"}, "우정섭": {"club": "턴오버(농구부)", "place": "강당 (층 미지정)"}, "박효정": {"club": "룩앳미", "place": "1-9"}, "박상희": {"club": "이에스에이", "place": "1-1"}, "김경숙": {"club": "버밀리온", "place": "5층 미술실"}, "양정민": {"club": "교육벼리", "place": "1-11"}, "방그래": {"club": "모션", "place": "2-3 / 교내"}, "정종민": {"club": "바이오스피어", "place": "2-1 / 생명과학실"}, "송지윤": {"club": "와이씨씨", "place": "2-4 / 1학년 각 학급 교실 / 교내 게시판 및 복도"}, "이병국": {"club": "화생방", "place": "2-11 / 화학실"}, "오정훈": {"club": "메디코어", "place": "1-3 / 화학실"}, "박소희": {"club": "디데이", "place": "음악실 (1·2 구분 미지정)"}, "곽세진": {"club": "온에어", "place": "방송실 / 자판기 앞 / 강당 / 시청각실 / 도서관 / 1·2학년 교실"}, "조영산": {"club": "에이오티에스", "place": "2-5"}, "이경희": {"club": "바이오홀릭", "place": "1-8"}, "김옥자": {"club": "신문읽기반", "place": "교과융합실2"}, "배상임": {"club": "지역사회 탐구반", "place": "3-3"}, "류규하": {"club": "미디어와 사회반", "place": "3-7"}, "곽경미": {"club": "수학주제탐구반", "place": "3-8"}, "김병우": {"club": "체육 탐구반", "place": "3-5"}, "권수현": {"club": "경제/경영 탐구반", "place": "3-12"}, "정진엽": {"club": "배움의 정석", "place": "3-9"}, "조은진": {"club": "도시문화예술 탐구반", "place": "3-4"}, "한성욱": {"club": "직업 가치 탐구반", "place": "융합교과1"}, "최정숙": {"club": "바이오 메디컬", "place": "3-10"}, "우정연": {"club": "진로 관련 시사탐구반", "place": "3-2"}, "박은주": {"club": "독서토론반", "place": "3-1"}, "이상명": {"club": "인문사회 주제탐구반", "place": "3-6"}};

function resolve(t, day, p){
  const e = t.tt[day]?.[p];
  if(e && e[0]==="동아"){
    const c=CLUBS[t.name];
    if(!c){const d=deskLoc(t);return {subj:"동아",cls:null,room:d.room||null,text:d.label+" (기본 자리)",guess:false};}
    const aliases={"컴퓨터1실":"컴퓨터실1","스팀실":"STEAM실","교과융합실2":"융합교과실2","융합교과1":"융합교과실1","5층 미술실":"미술실"};
    const room=ROOMS[aliases[c.place]||c.place]||null;
    return {subj:"동아",cls:null,room,text:room?null:c.club+" · "+c.place,guess:false};
  }
 if (!e) return null;
  const [subj, room] = e;
  if (subj === "─▷"){ const prev = resolve(t, day, p-1); return prev ? {...prev, cont:true} : null; }
  let r = null, text = null, guess = false;
  const cls = isClass(room) ? room : null;
  if(subj === "과탐" && cls && cls.startsWith("1-"))return {subj,cls,room:ROOMS["물리실"],text:null,guess:false};
  const specific=TEACHING_ROOM[t.name];
  if(specific && specific.subjects.includes(subj))return {subj,cls,room:ROOMS[specific.room],text:null,guess:false};
  if (room && !isClass(room)){ r=ROOMS[ROOM_ALIAS[room] || room] || null; if(!r) text=room+" (도면 위치 미등록)"; }
  else if (SUBJECT_ROOM[subj]){ const o = SUBJECT_ROOM[subj]; r = o.room ? ROOMS[o.room] : null; text = o.text||null; guess = true; }
  else if (room){ r = ROOMS[ROOM_ALIAS[room] || room] || null; }
  else if (subj === "동아") text = "동아리 활동 (장소 미지정)";
  return {subj, cls, room:r, text, guess};
}
function deskOf(t){
  const d = desks[t.name]; if (!d) return null;
  const r = roomAt(d.floor, d.x, d.y);
  return {floor:d.floor, x:d.x, y:d.y, room:r, memo:d.memo||""};
}
function deskLoc(t){
  const d = deskOf(t);
  if (!d) return {floor:null, label:"자리 미등록"};
  const name = d.room ? roomTitle(d.room) : `${d.floor}층`;
  return {floor:d.floor, x:d.x, y:d.y, room:d.room, label:`${d.floor}층 ${name}${d.memo ? " · "+d.memo : ""}`};
}
function locOf(res){
  if (res.room) return {floor:res.room.floor, room:res.room, label:`${res.room.floor}층 ${roomTitle(res.room)}`};
  return {floor:null, label:res.text || "장소 정보 없음"};
}
const WORK_DAYS={"윤정혜":[4,5],"강신재":[4,5],"김규나":[4,5],"조현창":[1,2,3],"김지희":[1,2,3],"손영아":[1,2,3]};
const notWorking=(t,day)=>!!WORK_DAYS[t.name] && !WORK_DAYS[t.name].includes(Number(day));
const offLocation=()=>({floor:null,room:null,label:"오늘은 근무일이 아닙니다"});
function statusAt(t, day, min){
  if(notWorking(t,day))return {kind:"off",loc:offLocation(),title:"오늘은 근무일이 아닙니다",sub:"근무 요일: "+WORK_DAYS[t.name].map(d=>DAYN[d]).join("·")+" · 기본 자리와 위치 핀을 표시하지 않습니다."};
  if (day<1 || day>5) return {kind:"off", loc:deskLoc(t), title:"오늘은 수업이 없는 날이에요", sub:"주말에는 학교에 안 계실 수 있어요."};
  const list = PERIODS.filter(p => p.n <= DAY_LAST[day]);
  const cur = list.find(p => toMin(p.s) <= min && min < toMin(p.e));
  const time = p => `${p.s}~${p.e}`;
  if (cur){
    const res = resolve(t, day, cur.n);
    if (res){
      const l = locOf(res);
      return {kind:"class", period:cur.n, loc:l, res,
        title:l.label, sub:`${cur.n}교시 · ${full(res.subj==="─▷"?"":res.subj)}${res.cls?` · ${res.cls}반`:""} · 시간표상 수업 (${time(cur)})`};
    }
    const l = deskLoc(t);
    return {kind:"free", period:cur.n, loc:l, title:l.label, sub:`${cur.n}교시는 수업이 없어요 (${time(cur)}).${t.homeroom ? " "+freeNote(t) : ""}`};
  }
  const prev = [...list].reverse().find(p => toMin(p.e) <= min);
  const next = list.find(p => toMin(p.s) > min);
  if (!prev){ const l = deskLoc(t); return {kind:"before", loc:l, title:l.label, sub:`수업 전이에요. 1교시는 ${list[0].s}에 시작해요.`}; }
  if (!next){ const l = deskLoc(t); return {kind:"after", loc:l, title:l.label, sub:"오늘 일과가 끝났으니 선생님이 안 계실 수도 있어요."}; }
  const res = resolve(t, day, next.n);
  const l = res ? locOf(res) : deskLoc(t);
  const label = prev.n === LUNCH_AFTER ? "점심시간" : "쉬는 시간";
  return {kind:"break", period:next.n, loc:l, title:l.label, sub: res ? `${label} · ${next.n}교시(${next.s})에 이곳에서 수업해요.` : `${label} · 다음 ${next.n}교시는 수업이 없어요.`};
}

/* =========================================================
   시각 (실시간 / 지정)
   ========================================================= */
let sim = null;
const nowT = () => { if (sim) return sim; const v=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(p=>[p.type,p.value])); return {day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(v.weekday),min:Number(v.hour)*60+Number(v.minute)}; };

/* =========================================================
   화면
   ========================================================= */
let selected = null, query = "", zoom = innerWidth < 820 ? 2.4 : 1.8, viewFloor = 4, userFloor = false, placing = false, viewDay = null;
const fcls = f => f ? `f${f}` : "";

function renderChip() {
  const n = nowT();
  const isWeekday = n.day >= 1 && n.day <= 5;
  const cur = PERIODS.find(p => isWeekday && p.n <= DAY_LAST[n.day] && toMin(p.s) <= n.min && n.min < toMin(p.e));
  let label;
  if (!isWeekday) label = "주말";
  else if (cur) label = cur.n + "교시";
  else if (n.min < toMin(PERIODS[0].s)) label = "수업 전";
  else if (n.min >= toMin(PERIODS[3].e) && n.min < toMin(PERIODS[4].s)) label = "점심시간";
  else if (n.min >= toMin(PERIODS.find(p => p.n === DAY_LAST[n.day]).e)) label = "수업 종료";
  else label = "쉬는 시간";
  const c = $("chip");
  c.textContent = `${sim ? "지정 시간 · " : ""}${DAYN[n.day]} ${pad(Math.floor(n.min / 60))}:${pad(n.min % 60)} · ${label}`;
  c.className = "chip" + (sim ? " sim" : "");
}
function renderList(){
  const n = nowT(), q = query.trim().replace(/\s/g,"");
  const items = TEACHERS.filter(t => !q || t.name.includes(q) || t.searchSubjects.replace(/\s/g,"").includes(q) || (t.homeroom && t.homeroom.includes(q)));
  $("list").innerHTML = items.length ? items.map(t => {
    const st = statusAt(t, n.day, n.min), f = st.loc.floor;
    const meta = [t.main, t.homeroom ? t.homeroom+" 담임" : ""].filter(Boolean).join(" · ");
    return `<button class="row" data-id="${t.no}" aria-pressed="${selected===t.no}">
      <span class="badge ${fcls(f)}">${f ? f+"F" : "?"}</span>
      <span class="rt"><b>${esc(t.name)} 선생님</b><small title="${esc(meta)}">${esc(meta)}</small><span>${esc(st.loc.label)}${st.kind==="after" ? " · 일과 종료" : ""}</span></span></button>`;
  }).join("") : `<div class="empty">찾는 선생님이 없어요. 이름이나 과목을 다시 확인해 보세요.</div>`;
  $("list").querySelectorAll(".row").forEach(b => b.onclick = () => { selected = Number(b.dataset.id); userFloor = false; placing = false; viewDay = null; $("app").dataset.mode = "detail"; render(); scrollTo({top:0}); });
}

function mapBlock(floor, st, t){
  const im = IMG[floor], W = im.w, H = im.h;
  let html = "", pos = null;
  const target = st.loc;
  if (!placing && target.floor === floor){
    if (target.room){ const r = target.room; html += `<div class="hl" style="left:${r.x1/W*100}%;top:${r.y1/H*100}%;width:${(r.x2-r.x1)/W*100}%;height:${(r.y2-r.y1)/H*100}%"></div>`; }
    const px = target.x ?? target.room.cx, py = target.y ?? target.room.cy;
    html += `<div class="pin" style="left:${px/W*100}%;top:${py/H*100}%"></div>`; pos = {x:px/W};
  }
  const d = deskOf(t);
  if (placing && d && d.floor === floor) html += `<div class="pin" style="left:${d.x/W*100}%;top:${d.y/H*100}%;background:var(--brand)"></div>`;
  return {pos, html: `<div class="mapwrap ${placing?"placing":""}" id="mapwrap"><div class="mapinner" id="mapinner" style="width:${zoom*100}%">
      <img id="mapimg" src="${im.data}" alt="${floor}층 도면" draggable="false">${html}</div></div>`};
}

function renderDetail(){
  const box = $("detail");
  if (selected === null){
    box.innerHTML = `<div class="panel"><div class="nomap">선생님을 고르면<br>시간표상 수업 장소와 등록 자리를 안내해 드려요.</div></div>`;
    return;
  }
  const t = TEACHERS.find(x => x.no === selected), n = nowT();
  const st = statusAt(t, n.day, n.min), f = st.loc.floor;
  if (!userFloor && !placing && f) viewFloor = f;
  const showDay = viewDay ?? ((n.day>=1 && n.day<=5) ? n.day : 1);
  const mb = mapBlock(viewFloor, st, t);
  const d = deskOf(t);

  const floorsBtns = [1,2,3,4,5].map(x => `<button class="fbtn f${x} ${f===x&&!placing?"here":""}" role="tab" aria-selected="${viewFloor===x}" data-f="${x}">${x}F</button>`).join("");
  const stops = PERIODS.filter(p => p.n <= DAY_LAST[showDay]).map(p => {
    const res = resolve(t, showDay, p.n);
    const l = res ? locOf(res) : deskLoc(t);
    const isNow = st.period === p.n && showDay === n.day && st.kind === "class";
    const info = notWorking(t,showDay) ? "근무일 아님" : res ? `${full(res.subj==="─▷"?"":res.subj)}${res.cls?` · ${res.cls}반`:""}${res.cont?" (연강)":""}` : "수업 없음"+(t.homeroom ? " · "+freeNote(t) : "");
    return `<li><button class="stop ${isNow?"now":""}" data-p="${p.n}"><span class="node"><b class="${fcls(l.floor)}">${p.n}</b></span>
      <span class="t"><b>${esc(l.label)}</b><span>${p.s}~${p.e} · ${esc(info)}</span></span></button></li>`;
  }).join("");

  box.innerHTML = `
    <button class="back" id="back">← 선생님 목록</button>
    <section class="answer">
      <span class="badge big ${fcls(f)}">${f ? f : "?"}</span>
      <div><p class="who">${esc(t.name)} 선생님${t.homeroom ? " · "+t.homeroom+" 담임" : ""}${t.role ? " · "+esc(t.role) : ""}</p>
      <span class="tag" style="${!["class","break"].includes(st.kind) && !notWorking(t,n.day) ? "display:none" : ""}">${notWorking(t,n.day) ? "근무 요일 안내" : st.kind==="class" ? "시간표상 수업 장소" : st.kind==="break" ? "다음 교시 장소 · 현재 위치 아님" : ""}</span><h2>${esc(st.title)}</h2><p>${esc(st.sub)}</p>
      ${st.res && st.res.guess ? `<span class="tag">교과 특성상 특별실 수업으로 추정한 위치예요</span>` : ""}
      ${(st.kind!=="class") && !d ? `<span class="tag">아직 자리가 등록되지 않았어요</span>` : ""}</div>
    </section>
    <section class="panel">
      <div class="floors" role="tablist" aria-label="층 선택">${floorsBtns}
        <div class="zoom"><button id="zo" aria-label="축소">−</button><button id="zi" aria-label="확대">+</button></div></div>
      ${IMG[viewFloor] ? mb.html : ""}
      ${f && f !== viewFloor && !placing ? `<p class="hint">📍 안내 장소는 ${f}층입니다. 위에서 ${f}F를 눌러 보세요.</p>` : ""}
      ${!f && !placing ? `<p class="hint">도면에 표시할 수 있는 위치가 아니에요. ${esc(st.loc.label)}</p>` : ""}
      ${placing ? `<p class="hint"><b>${viewFloor}층 도면에서 자리를 눌러 주세요.</b> 교무센터나 연구실 안의 책상 위치를 그대로 찍으면 돼요.</p>` : ""}

    </section>
    <section class="panel">
      <div class="days" role="group" aria-label="요일">${[1,2,3,4,5].map(x => `<button data-d="${x}" aria-pressed="${showDay===x}">${DAYN[x]}</button>`).join("")}</div>
      <ol class="route">${stops}</ol>
      <p class="small">교시를 누르면 그 시각의 위치로 바꿔 보여 줘요.</p>
    </section>`;

  $("back").onclick = () => { $("app").dataset.mode = "search"; };
  box.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { viewFloor = Number(b.dataset.f); userFloor = true; renderDetail(); });
  $("zi").onclick = () => { zoom = Math.min(4, zoom+.6); renderDetail(); };
  $("zo").onclick = () => { zoom = Math.max(1, zoom-.6); renderDetail(); };
  box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { viewDay = Number(b.dataset.d); renderDetail(); });
  box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    const p = PERIODS.find(x => x.n === Number(b.dataset.p));
    sim = {day: showDay, min: toMin(p.s)+1}; userFloor = false; render();
  });
  if (mb.pos && !placing){
    requestAnimationFrame(() => { const w = $("mapwrap"), inn = $("mapinner"); if (w && inn) w.scrollLeft = inn.clientWidth*mb.pos.x - w.clientWidth/2; });
  }
}

function render(){ renderChip(); renderList(); renderDetail(); }

function goHome(){
 selected=null; query=""; sim=null; viewDay=null; placing=false; userFloor=false; viewFloor=4;
 zoom=innerWidth<820?2.4:1.8;
 $("q").value="";
 $("app").dataset.mode="list";
 document.querySelectorAll("details[open]").forEach(el=>el.open=false);
 render(); scrollTo({top:0,behavior:"auto"});
}
$("homeLogo").onclick=goHome;
$("q").addEventListener("input", e => {
  query = e.target.value;
  // 상세 화면에서 검색해도 결과 목록을 즉시 표시합니다.
  $("app").dataset.mode = "list";
  renderList();
});
$("simApply").onclick = () => {
 if($("simDay").value===""){alert("요일을 선택해 주세요.");$("simDay").focus();return;}
 if(!$("simTime").value){alert("시간을 선택해 주세요.");$("simTime").focus();return;}
 sim={day:Number($("simDay").value),min:toMin($("simTime").value)};userFloor=false;render();
};
$("simTime").addEventListener("click",function(){try{if(typeof this.showPicker==="function")this.showPicker();}catch(e){this.focus();}});
$("simLive").onclick = () => { sim = null; userFloor = false; render(); };


render();
let lastSig = "";
setInterval(() => {
  if (placing) return;
  const n = nowT(), tt = TEACHERS.find(x => x.no === selected);
  const sig = n.day + ":" + n.min + ":" + (tt ? statusAt(tt, n.day, n.min).title : "");
  renderChip(); renderList();
  if (sig !== lastSig){ lastSig = sig; renderDetail(); }
}, 30000);
</script>
